version: "3.8"

services:
  # ============ 基础设施 ============
  postgres:
    image: postgres:16-alpine
    container_name: edgefall-pg
    environment:
      POSTGRES_USER: ${PG_USER:-edgesys}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
      POSTGRES_DB: ${PG_DATABASE:-edgesys}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-edgesys}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edgefall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tdengine:
    image: tdengine/tdengine:3.3.4.8
    container_name: edgefall-tdengine
    ports:
      - "6030:6030"
      - "6041:6041"
    volumes:
      - td_data:/var/lib/taos
    environment:
      TAOS_FQDN: tdengine
    healthcheck:
      test: ["CMD", "taos", "-s", "SELECT SERVER_VERSION();"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edgefall-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  # ============ 应用服务 ============
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: edgefall-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-edgesys}:${PG_PASSWORD:-change-me}@postgres:5432/${PG_DATABASE:-edgesys}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TDENGINE_HOST: tdengine
      MQTT_BROKER_HOST: mosquitto
      USE_CELERY: "true"
      ENABLE_SCHEDULER: "false"
      ALEMBIC_DATABASE_URL: postgresql://${PG_USER:-edgesys}:${PG_PASSWORD:-change-me}@postgres:5432/${PG_DATABASE:-edgesys}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tdengine:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: edgefall-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-edgesys}:${PG_PASSWORD:-change-me}@postgres:5432/${PG_DATABASE:-edgesys}
      ALEMBIC_DATABASE_URL: postgresql://${PG_USER:-edgesys}:${PG_PASSWORD:-change-me}@postgres:5432/${PG_DATABASE:-edgesys}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TDENGINE_HOST: tdengine
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tdengine:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: beat
    container_name: edgefall-beat
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-edgesys}:${PG_PASSWORD:-change-me}@postgres:5432/${PG_DATABASE:-edgesys}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: edgefall-flower
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============ 反向代理 ============
  nginx:
    image: nginx:1.27-alpine
    container_name: edgefall-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  td_data:
  mosquitto_data:
